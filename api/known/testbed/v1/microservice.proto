syntax = "proto3";

package default.api.known.testbed.v1;

option go_package = "github.com/grpc-kit/testbed/api/known/testbed/v1;testbedv1";

// 同服务内的 proto 文件使用相对路径引用，既不包含代码仓库前缀
//import "api/known/testbed/v1/microservice.common.proto";
import "api/known/testbed/v1/demo.proto";

// 引入依赖的外部 proto 文件
import "github.com/grpc-kit/api/known/status/v1/response.proto";

// 该微服务支持的 RPC 方法定义
service KnownTestbed {
  // 内置服务，健康检查
  rpc HealthCheck(grpc_kit.api.known.status.v1.HealthCheckRequest) returns (grpc_kit.api.known.status.v1.HealthCheckResponse) {}

  // 参考示例，书籍管理，实现相同一组任务的方法整合在一起，前后均需空行隔开
