syntax = "proto3";

// 根据具体的微服务名称做更改
package default.api.known.testbed.v1;

option go_package = "github.com/grpc-kit/testbed/api/known/testbed/v1;testbedv1";

// 引入 google 公共类型
import "google/protobuf/timestamp.proto";

// 引入第三方依赖的 proto 文件
import "github.com/grpc-kit/api/known/example/v1/example.proto";

message Pong {
  // UUID 资源编号
  string uuid = 1;

  // Pong 单个资源响应内容
  grpc_kit.api.known.example.v1.ExampleResponse pong = 2;

  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}